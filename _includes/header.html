<header class="site-header">
  <div class="wrap">
    <a class="logo" href="{{ '/' | relative_url }}">
      <img src="https://res.cloudinary.com/haazen/image/upload/logo-white.png" alt="Haazen" height="32">
    </a>
    <nav>
      {% for item in site.nav %}
        {% assign is_current = false %}{% if item.url == '/' %}{% assign is_current = true %}{% endif %}
        <a href="{% if item.url contains '://' %}{{ item.url }}{% else %}{{ item.url | relative_url }}{% endif %}"{% if is_current %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
