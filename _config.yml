title: Haazen Blog
description: Notes, builds and write-ups by Marcel Haazen.
author: Marcel Haazen
url: "https://blog.haazen.xyz"
baseurl: ""
lang: en

# Same URL scheme as the old Neko Blog System: /2018/01/post-name/
permalink: /:year/:month/:title/

# Front page shows 6 posts per page; page 2+ lives at /page/2/
paginate: 6
paginate_path: "/page/:num/"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag

# Slide-out menu, same as haazen.xyz
nav:
  - title: Home
    url: https://haazen.xyz/
  - title: About
    url: https://haazen.xyz/about
  - title: Certificates
    url: https://haazen.xyz/certs
  - title: Projects
    url: https://haazen.xyz/projects
  - title: Blog
    url: /
  - title: Contact
    url: https://haazen.xyz/contact

# Footer icons (Font Awesome brand icon names)
social:
  - title: Twitter
    icon: fa-twitter
    url: https://x.com/nekocentral
  - title: GitHub
    icon: fa-github
    url: https://github.com/nekocentral
  - title: LinkedIn
    icon: fa-linkedin-in
    url: https://www.linkedin.com/in/mhaazen

# Forty's banner/theme colour
theme_color: "#242943"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - LICENSE.txt
